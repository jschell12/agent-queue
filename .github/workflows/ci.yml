name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (ruff + pytest)
        # Pin the linter/test tool versions so the lint gate is deterministic.
        # An unpinned ruff can add new checks under the selected rule categories
        # (E/W/F/I/UP/B/C4) in a future release and fail CI on unchanged code —
        # exactly the "gate fails on pre-existing style" flakiness this guards against.
        run: python -m pip install --upgrade pip "ruff==0.15.21" "pytest==9.1.1"

      - name: Lint
        run: make lint

      - name: Test
        run: make test
